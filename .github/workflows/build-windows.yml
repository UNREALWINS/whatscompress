name: Gerar aplicativo portátil para Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-portable:
    name: Testar e compilar o portátil
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Obter código do projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Instalar dependências Python
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Verificar ou baixar FFmpeg
        shell: pwsh
        run: .\scripts_baixar_ffmpeg.ps1

      - name: Testes automatizados
        shell: pwsh
        run: python -m unittest discover -s testes -v

      - name: Compilar WhatsCompress.exe
        shell: pwsh
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name WhatsCompress --contents-directory _internal whatscompress.py

      - name: Montar e verificar ZIP portátil
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -Path 'dist\WhatsCompress\bin' -ItemType Directory -Force | Out-Null
          Copy-Item 'bin\ffmpeg.exe' 'dist\WhatsCompress\bin\ffmpeg.exe' -Force
          Copy-Item 'bin\ffprobe.exe' 'dist\WhatsCompress\bin\ffprobe.exe' -Force
          Copy-Item 'LEIA-ME.txt' 'dist\WhatsCompress\LEIA-ME.txt' -Force
          Copy-Item 'AVISOS_TERCEIROS.md' 'dist\WhatsCompress\AVISOS_TERCEIROS.md' -Force
          Copy-Item 'NOTAS_DA_VERSAO_V4_0.md' 'dist\WhatsCompress\NOTAS_DA_VERSAO_V4_0.md' -Force
          New-Item -Path 'dist\WhatsCompress\licencas' -ItemType Directory -Force | Out-Null
          & (Resolve-Path 'bin\ffmpeg.exe').Path -version | Out-File 'dist\WhatsCompress\licencas\ffmpeg-versao-e-configuracao.txt' -Encoding utf8
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/FFmpeg/FFmpeg/master/COPYING.GPLv3' -OutFile 'dist\WhatsCompress\licencas\FFmpeg-GPLv3.txt' -UseBasicParsing
          if (-not (Test-Path 'dist\WhatsCompress\licencas\FFmpeg-GPLv3.txt')) { throw 'Licenca GPLv3 do FFmpeg ausente.' }
          $required = @(
            'dist\WhatsCompress\WhatsCompress.exe',
            'dist\WhatsCompress\bin\ffmpeg.exe',
            'dist\WhatsCompress\bin\ffprobe.exe'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Arquivo ausente: $path" }
          }
          Compress-Archive -Path 'dist\WhatsCompress' -DestinationPath 'WhatsCompress_V4_PORTABLE_WINDOWS.zip' -CompressionLevel Optimal -Force

      - name: Disponibilizar pacote do Windows
        uses: actions/upload-artifact@v4
        with:
          name: WhatsCompress-V4-Windows-Portable
          path: WhatsCompress_V4_PORTABLE_WINDOWS.zip
          if-no-files-found: error
          retention-days: 30

      - name: Gerar resumo SHA-256 para verificar o pacote
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arquivo = 'WhatsCompress_V4_PORTABLE_WINDOWS.zip'
          $hash = (Get-FileHash -Algorithm SHA256 -Path $arquivo).Hash.ToLowerInvariant()
          "$hash  $arquivo" | Set-Content -Path 'SHA256SUMS.txt' -Encoding ascii
          Get-Content 'SHA256SUMS.txt'

      - name: Publicar versão oficial v4.0 no GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $versao = 'v4.0'
          $existentes = gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 100 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Nao foi possivel consultar as versoes publicadas.' }
          if (@($existentes | Where-Object { $_.tagName -eq $versao }).Count -gt 0) {
            Write-Host 'A versao v4.0 ja existe. Nenhuma publicacao duplicada sera feita.'
            exit 0
          }
          gh release create $versao 'WhatsCompress_V4_PORTABLE_WINDOWS.zip' 'SHA256SUMS.txt' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'WhatsCompress v4.0 - Primeira versao oficial' --notes-file 'NOTAS_DA_VERSAO_V4_0.md' --latest
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao criar o GitHub Release v4.0.' }
          Write-Host 'Publicacao oficial concluida:'
          Write-Host ('https://github.com/' + $env:GITHUB_REPOSITORY + '/releases/tag/' + $versao)
